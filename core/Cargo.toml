[workspace]
resolver = "2"
members = [
    "crates/piercast-schema",
    "crates/piercast-core",
    "crates/piercast-api",
    "crates/piercast-mcp",
    "crates/piercast-tailscale",
    "crates/piercastd",
    "crates/piercast",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
authors = ["Piercast <hello@piercast.io>"]
repository = "https://github.com/piercast/piercast"

[workspace.dependencies]
piercast-schema = { path = "crates/piercast-schema" }
piercast-core = { path = "crates/piercast-core" }
piercast-api = { path = "crates/piercast-api" }
piercast-mcp = { path = "crates/piercast-mcp" }
piercast-tailscale = { path = "crates/piercast-tailscale" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.8", features = ["server", "transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.33"
tempfile = "3"
open = "5"
hostname = "0.4"
schemars = "1"
