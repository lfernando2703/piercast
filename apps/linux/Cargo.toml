[package]
name = "piercast-linux"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Piercast Linux desktop shell (GTK4 + libadwaita via Relm4)"

[[bin]]
name = "piercast-gui"
path = "src/main.rs"

[dependencies]
relm4 = { version = "0.9", features = ["libadwaita", "gnome_46"] }
relm4-components = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
